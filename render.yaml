services:
  - type: web
    name: notes-crud-demo
    env: php
    plan: free
    buildCommand: "composer install --no-dev && php artisan config:cache && php artisan route:cache"
    startCommand: "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: DB_CONNECTION
        value: pgsql